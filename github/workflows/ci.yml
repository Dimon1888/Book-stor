name: Java CI

on:
  - push
  - pull_request_target

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env file from template
        run: |
          cp .env.template .env
          sed -i 's/your_root_password_here/rootpassword123/g' .env
          sed -i 's/your_password_here/userpassword123/g' .env
          sed -i 's/your_jwt_secret_key_here/404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971/g' .env

      - name: Start MySQL in Docker
        run: docker compose up -d mysqldb

      - name: Wait for MySQL readiness
        run: |
          echo "Waiting for MySQL container..."
          until [ "$(docker inspect --format='{{.State.Health.Status}}' mysqldb)" == "healthy" ]; do
            sleep 3
          done
          echo "MySQL is ready!"

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/online_bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: spring_user
          SPRING_DATASOURCE_PASSWORD: userpassword123
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
          JWT_EXPIRATION: 3600000

      - uses: mate-academy/auto-approve-action@v2
        if: ${{ github.event.pull_request && success() }}
        with:
          github-token: ${{ github.token }}

      - uses: mate-academy/auto-reject-action@v2
        if: ${{ github.event.pull_request && failure() }}
        with:
          github-token: ${{ github.token }}
