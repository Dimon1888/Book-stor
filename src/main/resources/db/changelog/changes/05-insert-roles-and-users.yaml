databaseChangeLog:
  - changeSet:
      id: insert-role-admin
      author: developer
      preconditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM roles WHERE name = 'ROLE_ADMIN'
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_ADMIN

  - changeSet:
      id: insert-role-user
      author: developer
      preconditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM roles WHERE name = 'ROLE_USER'
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_USER

  - changeSet:
      id: insert-default-users
      author: developer
      preconditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE email IN ('admin@example.com', 'user@example.com')
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@example.com
              - column:
                  name: password
                  value: "$2a$10$S9S8Ua1pCkWzPZ.XzE03sObW3Y2M9hJ/H/0R8V2yE.A11fM2G7bW2"
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: User
              - column:
                  name: is_deleted
                  valueBoolean: false
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: user@example.com
              - column:
                  name: password
                  value: "$2a$10$n9C2C.pB01A9m8.3QG7uIeQ4dJ00O2T/x2p.T24lW08Cg9z31v/R6"
              - column:
                  name: first_name
                  value: Regular
              - column:
                  name: last_name
                  value: User
              - column:
                  name: is_deleted
                  valueBoolean: false

  - changeSet:
      id: assign-roles-to-users
      author: developer
      preconditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users_roles
      changes:
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@example.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_ADMIN')"
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@example.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_USER')"
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'user@example.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_USER')"