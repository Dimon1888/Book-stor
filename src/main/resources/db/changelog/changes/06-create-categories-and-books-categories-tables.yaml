databaseChangeLog:
  - changeSet:
      id: create-categories-table
      author: your_name
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: create-books-categories-table
      author: your_name
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: books_categories
      changes:
        - createTable:
            tableName: books_categories
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_books_categories_book
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_books_categories_category
                    referencedTableName: categories
                    referencedColumnNames: id
        - addPrimaryKey:
            tableName: books_categories
            columnNames: book_id, category_id
            constraintName: pk_books_categories